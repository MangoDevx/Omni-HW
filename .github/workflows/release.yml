name: Release

# Linux releases are tagged `linux-v<version>`, so they never trigger (or get mistaken for) the
# Windows releases tagged `v<version>` on main. They are never marked "latest": the Windows
# update check and the website read the latest release.
on:
  push:
    tags: ['linux-v*']

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Headers eframe/winit link against on Linux.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify tag matches workspace version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "omnihw-app") | .version')"
          if [ -z "$version" ]; then
            echo "::error::Could not read the omnihw-app version from cargo metadata."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "linux-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version linux-v$version. Bump Cargo.toml or retag."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          # The lines after "## <version>" up to the next "## " heading.
          awk -v h="## $VERSION" '
            $0 == h { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '^[[:space:]]*- ' notes.md; then
            echo "::error::CHANGELOG.md has no '- ' bullets under '## $VERSION'. Rename '## Unreleased' to '## $VERSION'."
            exit 1
          fi

      # Built on the oldest supported Ubuntu runner so the binary runs on older glibc too.
      - name: Build release
        run: cargo build --release -p omnihw-app --locked

      - name: Package and hash
        run: |
          set -euo pipefail
          name="omnihw-$VERSION-linux-x86_64"
          mkdir -p "dist/$name"
          install -m755 target/release/omnihw "dist/$name/omnihw"
          install -m644 packaging/linux/omnihw.desktop packaging/linux/omnihw.png LICENSE "dist/$name/"
          install -m644 packaging/linux/README.md "dist/$name/INSTALL.md"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
          echo "HASH=$(cut -d' ' -f1 "dist/$name.tar.gz.sha256")" >> "$GITHUB_ENV"

      - name: Build release body
        run: |
          set -euo pipefail
          {
            echo '## Download'
            echo ''
            echo "**\`$ARCHIVE\`** holds the \`omnihw\` executable for x86-64 Linux, plus a menu entry and icon. Unpack it and run \`./omnihw\`; \`INSTALL.md\` inside shows how to add it to your menu."
            echo ''
            echo "SHA-256: \`$HASH\`"
            echo ''
            echo "## What's new"
            echo ''
            cat notes.md
          } > dist/body.md

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/body.md
          if-no-files-found: error
          retention-days: 7

  # The checks run once, in ci.yml, on the push to linux-support. Wait for that run on this
  # exact commit.
  ci-passed:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          POLL="${POLL:-30}"                   # seconds between checks
          NO_RUN_LIMIT="${NO_RUN_LIMIT:-300}"  # give up if no CI run exists after this many seconds
          TIMEOUT="${TIMEOUT:-2400}"           # give up waiting after this many seconds
          elapsed=0
          while true; do
            # Newest first, as: id, status, conclusion. Manual (workflow_dispatch) runs count, pull_request runs don't.
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --json databaseId,status,conclusion,event --limit 20 \
              --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")] | first // empty | [.databaseId, .status, .conclusion] | @tsv')"
            if [ -n "$run" ]; then
              IFS=$'\t' read -r id status conclusion <<< "$run"
              url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$id"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "::notice::CI passed for $GITHUB_SHA: $url"
                  exit 0
                fi
                echo "::error::CI failed for $GITHUB_SHA ($conclusion): $url"
                exit 1
              fi
              echo "CI run $id is $status; waiting... ($elapsed s)"
            else
              if [ "$elapsed" -ge "$NO_RUN_LIMIT" ]; then
                echo "::error::No CI run found for $GITHUB_SHA. Push the commit to linux-support (CI runs on its pushes) before tagging, or run CI on it manually (Actions > CI > Run workflow)."
                exit 1
              fi
              echo "No CI run for $GITHUB_SHA yet; waiting... ($elapsed s)"
            fi
            if [ "$elapsed" -ge "$TIMEOUT" ]; then
              echo "::error::Timed out after $TIMEOUT s waiting for CI on $GITHUB_SHA."
              exit 1
            fi
            sleep "$POLL"
            elapsed=$((elapsed + POLL))
          done

  publish:
    needs: [build, ci-passed]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(dist/*.tar.gz dist/*.tar.gz.sha256)
          # A re-run finds the release already there: refresh its files.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Omni-HW for Linux ${GITHUB_REF_NAME#linux-v}" \
            --notes-file dist/body.md \
            --latest=false \
            --verify-tag
