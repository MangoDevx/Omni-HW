[package]
name = "omnihw-app"
description = "Omni-HW: CPU-Z / GPU-Z / HWiNFO in one app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "omnihw"
path = "src/main.rs"

[dependencies]
omnihw-core = { path = "../omnihw-core" }
# The UI: Zed's gpui (GPU-rendered, retained) with the gpui-component widgets, through the one
# gpui-kit crate that pins a matching set.
gpui-kit = "0.11.0"
# Wakes the UI thread from the sampler and worker threads (already in gpui's dependency tree).
async-channel = "2"
raw-window-handle = "0.6"
# The fonts the egui build used (Ubuntu Light, Hack and two emoji fonts), embedded so the app
# keeps its look; licences in the crate (UFL, OFL, MIT).
epaint_default_fonts = "0.36"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Networking_WinHttp",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-service = "0.8.1"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
omnihw-core = { path = "../omnihw-core", features = ["testkit"] }
# Headless UI tests: draw pages in a window without a screen and query them through the
# accessibility tree.
gpui-kit = { version = "0.11.0", features = ["test-support"] }
