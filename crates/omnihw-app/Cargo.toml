[package]
name = "omnihw-app"
description = "Omni-HW: CPU-Z / GPU-Z / HWiNFO in one app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "omnihw"
path = "src/main.rs"

[dependencies]
omnihw-core = { path = "../omnihw-core" }
eframe = "0.36"
egui = "0.36"
# Alert notifications through the desktop's notification service (D-Bus, pure Rust).
notify-rust = "4"
# The "Browse…" folder chooser, through the XDG desktop portal.
rfd = "0.15"

[dev-dependencies]
# Headless UI tests: draw pages without a window, query them through the accessibility tree,
# and compare screenshots (rendered with wgpu) against the PNGs in tests/snapshots.
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu"] }
