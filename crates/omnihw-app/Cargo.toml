[package]
name = "omnihw-app"
description = "Omni-HW: CPU-Z / GPU-Z / HWiNFO in one app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "omnihw"
path = "src/main.rs"

[dependencies]
omnihw-core = { path = "../omnihw-core" }
eframe = "0.36"
egui = "0.36"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Networking_WinHttp",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-service = "0.8.1"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
omnihw-core = { path = "../omnihw-core", features = ["testkit"] }
# Headless UI tests: draw pages without a window, query them through the accessibility tree,
# and compare screenshots (rendered with wgpu) against the PNGs in tests/snapshots.
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu"] }
