[package]
name = "omnihw-core"
description = "Hardware detection and data model for Omni-HW"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Hex encoding of the raw data the root helper prints (see linux::rootdata).
hex = "0.4"
# ioctls (NVMe SMART log), CPU affinity for the memory test.
libc = "0.2"
# NVIDIA NVML (GPU details and sensors), loaded at runtime from the driver's libnvidia-ml.so.1.
nvml-wrapper = "0.13"
# statvfs for volume free space.
rustix = { version = "1", features = ["fs"] }
# The systemd journal entries `journalctl --output=json` prints (Event Log page).
serde_json = "1"

[dev-dependencies]
# Fake sysfs/procfs trees for the Linux readers' tests.
tempfile = "3"
